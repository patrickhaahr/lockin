<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark premium background squircle -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282C34" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>
    
    <!-- LeetCode-style orange gradient for the padlock -->
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB347" />
      <stop offset="100%" stop-color="#F28E00" />
    </linearGradient>

    <!-- Subtle drop shadow to make the padlock pop -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <g filter="url(#shadow)">
    <!-- Shackle -->
    <path 
      d="M 176 240 V 160 A 80 80 0 0 1 336 160 V 240" 
      fill="none" 
      stroke="url(#lockGrad)" 
      stroke-width="48" 
      stroke-linecap="round" 
    />
    
    <!-- Lock Body -->
    <rect 
      x="128" 
      y="224" 
      width="256" 
      height="192" 
      rx="40" 
      fill="url(#lockGrad)" 
    />
  </g>

  <!-- Keyhole Cutout (Code Brackets </>) -->
  <g 
    fill="none" 
    stroke="#15171C" 
    stroke-width="32" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  >
    <!-- Left bracket < -->
    <path d="M 204 288 L 164 320 L 204 352" />
    
    <!-- Slash / -->
    <line x1="276" y1="272" x2="236" y2="368" />
    
    <!-- Right bracket > -->
    <path d="M 308 288 L 348 320 L 308 352" />
  </g>
</svg>